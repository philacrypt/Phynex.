<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PHYNEX - Cart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8fa;color:#172033}.top{background:#071a49;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{width:94%;max-width:1200px;margin:25px auto}.title{font-size:26px;font-weight:800;margin-bottom:18px}.layout{display:grid;grid-template-columns:1fr 350px;gap:18px}.card,.summary{background:#fff;border:1px solid #e1e4e8;border-radius:12px;padding:18px}.item{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item img{width:90px;height:90px;object-fit:contain;border:1px solid #eee;border-radius:8px}.name{font-weight:700;margin-bottom:7px}.unit{color:#0875e1;font-weight:700}.controls{display:flex;align-items:center;gap:10px;margin-top:10px}.controls button{width:30px;height:30px;border:1px solid #ccd2dc;background:#f7f8fa;border-radius:6px;font-size:18px;cursor:pointer}.controls span{min-width:25px;text-align:center;font-weight:700}.line{font-weight:800}.remove{border:0;background:none;color:#e53935;font-size:12px;margin-top:8px;cursor:pointer}.summary h2{margin-top:0}.row{display:flex;justify-content:space-between;padding:10px 0}.total{font-size:21px;font-weight:900;border-top:1px solid #ddd;margin-top:8px;padding-top:15px}.checkout{width:100%;padding:14px;background:#0875e1;color:#fff;border:0;border-radius:7px;font-weight:800;margin-top:15px;cursor:pointer}.checkout-note{font-size:12px;color:#687083;text-align:center;margin-top:8px}.continue{display:block;text-align:center;margin-top:12px;color:#0875e1;text-decoration:none}.empty{text-align:center;padding:55px 20px;color:#687083}.clear{border:1px solid #e53935;background:#fff;color:#e53935;padding:9px 14px;border-radius:6px;font-weight:700;cursor:pointer}@media(max-width:760px){.layout{grid-template-columns:1fr}.item{grid-template-columns:70px 1fr}.item img{width:70px;height:70px}.line{grid-column:2}.summary{order:-1}}
</style></head>
<body>
<header class="top"><strong>PHYNEX</strong><span id="accountBox" style="display:flex;align-items:center;gap:14px;"><a href="index.html">← Continue Shopping</a><a href="#" id="accountLogout" style="display:none;">Log out</a></span></header>
<main class="wrap"><div class="title">Your Cart</div><div class="layout"><section class="card"><div id="cartItems"></div></section><aside class="summary"><h2>Order Summary</h2><div class="row"><span>Items</span><strong id="itemCount">0</strong></div><div class="row"><span>Subtotal</span><strong id="subtotal">KSh 0</strong></div><div class="row"><span>Delivery</span><strong id="delivery">Calculated at checkout</strong></div><div class="row total"><span>Total</span><strong id="total">KSh 0</strong></div><button class="checkout" onclick="checkout()">Proceed to Checkout</button><div class="checkout-note" id="checkoutNote"></div><a class="continue" href="index.html">Continue Shopping</a></aside></div></main>
<script>
(function(){
'use strict';
const KEY='phynexCart';
const BUY_NOW_KEY='phynexBuyNow';
const CUSTOMER_TOKEN_KEY='phynexCustomerToken';
function getCart(){try{const c=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(c))return[];const cleaned=c.filter(x=>{const id=Number(x&&x.id);return Number.isInteger(id)&&id>0});if(cleaned.length!==c.length){localStorage.setItem(KEY,JSON.stringify(cleaned))}return cleaned}catch(e){return[]}}
function saveCart(c){localStorage.setItem(KEY,JSON.stringify(c));window.dispatchEvent(new Event('phynexCartUpdated'));}
function qtyOf(x){const q=Number(x.qty!=null?x.qty:x.quantity);return Number.isFinite(q)&&q>0?Math.floor(q):1}
function money(n){return 'KSh '+Number(n||0).toLocaleString('en-KE')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 let cart=getCart(); const box=document.getElementById('cartItems'); let count=0,total=0;
 if(!cart.length){box.innerHTML='<div class="empty"><h2>Your cart is empty</h2><p>Add products from the PHYNEX store.</p></div>';document.getElementById('itemCount').textContent='0';document.getElementById('subtotal').textContent='KSh 0';document.getElementById('total').textContent='KSh 0';return}
 cart.forEach(x=>{x.qty=qtyOf(x);x.quantity=x.qty;x.price=Number(x.price)||0;count+=x.qty;total+=x.price*x.qty});
 box.innerHTML=cart.map((x,i)=>`<div class="item"><img src="${escapeHtml(x.image||'')}" alt="${escapeHtml(x.name)}"><div><div class="name">${escapeHtml(x.name)}</div><div class="unit">${money(x.price)} each</div><div class="controls"><button type="button" onclick="changeQty(${i},-1)">−</button><span>${x.qty}</span><button type="button" onclick="changeQty(${i},1)">+</button></div><button type="button" class="remove" onclick="removeItem(${i})">Remove</button></div><div class="line">${money(x.price*x.qty)}</div></div>`).join('');
 document.getElementById('itemCount').textContent=count;
 document.getElementById('subtotal').textContent=money(total);
 document.getElementById('total').textContent=money(total);
 saveCart(cart);
}
window.changeQty=function(i,d){let c=getCart();if(!c[i])return;c[i].qty=Math.max(1,qtyOf(c[i])+d);c[i].quantity=c[i].qty;saveCart(c);render()};
window.removeItem=function(i){let c=getCart();if(!c[i])return;c.splice(i,1);saveCart(c);render()};
// Guests can check out without signing in.
window.checkout=function(){
 if(!getCart().length){alert('Your cart is empty.');return}
 window.location.href='checkout.html';
};
window.addEventListener('storage',function(e){if(e.key===KEY)render()});
window.addEventListener('phynexCartUpdated',render);
// Convert an old Buy Now value into the normal cart format if present.
try{const b=JSON.parse(localStorage.getItem(BUY_NOW_KEY));if(b&&b.product){const c=getCart();const p=b.product;const q=Math.max(1,Number(b.qty)||1);const existing=c.find(x=>x.id===p.id);if(existing){existing.qty=qtyOf(existing)+q;existing.quantity=existing.qty}else{c.push(Object.assign({},p,{qty:q,quantity:q}))}saveCart(c);localStorage.removeItem(BUY_NOW_KEY)}}catch(e){}
(function(){
 var logoutLink=document.getElementById('accountLogout');
 if(logoutLink && localStorage.getItem(CUSTOMER_TOKEN_KEY)){
  logoutLink.style.display='';
  logoutLink.addEventListener('click', function(e){
   e.preventDefault();
   var t=localStorage.getItem(CUSTOMER_TOKEN_KEY);
   localStorage.removeItem(CUSTOMER_TOKEN_KEY);
   if(t){ fetch('/api/customers/logout',{method:'POST',headers:{Authorization:'Bearer '+t}}).catch(function(){}); }
   window.location.href='index.html';
  });
 }
})();
render();
})();
</script></body></html>
