<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHYNEX - Category</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}.header{background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #e7eaf0;padding:14px 5%}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;max-width:1200px;margin:auto}.brand{font-size:25px;font-weight:800;color:#0875e1;text-decoration:none}.actions{display:flex;gap:10px}.btn{border:0;background:#0875e1;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700}.container{max-width:1200px;margin:auto;padding:25px 5% 90px}.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#0875e1;font-weight:700;margin-bottom:15px}h1{margin:5px 0 8px;font-size:28px}.sub{color:#687083;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e4e7ed;text-decoration:none;color:inherit;transition:.2s;display:flex;flex-direction:column}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(7,26,73,.12)}.pic{height:220px;background:#fff;padding:12px;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:contain}.info{padding:13px}.name{font-size:14px;font-weight:700;line-height:1.4;min-height:40px}.seller{font-size:12px;color:#687083;margin:7px 0}.price{font-size:18px;font-weight:800;color:#0875e1}.empty{background:#fff;border-radius:12px;padding:35px;text-align:center;color:#687083}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.container{padding:18px 12px 90px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:155px}.info{padding:9px}.name{font-size:12px}.price{font-size:15px}h1{font-size:22px}.brand{font-size:21px}}
</style>
</head>
<body>
<header class="header"><div class="top"><a class="brand" href="index.html">PHYNEX</a><div class="actions"><a class="btn" href="categories.html">Categories</a><a class="btn" href="cart.html">Cart</a></div></div></header>
<main class="container"><a class="back" href="categories.html"><i class="fa-solid fa-arrow-left"></i> All Categories</a><h1 id="title">Category</h1><p class="sub" id="count">Loading products...</p><div class="grid" id="grid"></div></main>
<script>
(function(){
 const grid=document.getElementById('grid'), title=document.getElementById('title'), count=document.getElementById('count');
 const category=new URLSearchParams(location.search).get('category')||'';
 function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}
 function money(v){return 'KSh '+Number(v||0).toLocaleString('en-KE')}
 async function load(){
  try{
   const r=await fetch('/api/products',{cache:'no-store'}); if(!r.ok) throw new Error();
   const data=await r.json(); let products=Array.isArray(data.products)?data.products:[];
   if(category){products=products.filter(p=>String(p.category||'').toLowerCase()===category.toLowerCase() || String(p.subcategory||'').toLowerCase()===category.toLowerCase());}
   title.textContent=category||'All Products'; count.textContent=products.length+' product'+(products.length===1?'':'s');
   grid.innerHTML=products.length?products.map(p=>
    '<a class="card" href="index.html?product='+encodeURIComponent(p.id)+'">'+
    '<div class="pic"><img src="'+esc(p.image||'')+'" alt="'+esc(p.name)+'" loading="lazy"></div>'+
    '<div class="info"><div class="name">'+esc(p.name)+'</div><div class="seller">'+(p.sellerName?'Sold by '+esc(p.sellerName):'')+'</div><div class="price">'+money(p.price)+'</div></div></a>'
   ).join(''):'<div class="empty">No approved products are currently in this category.</div>';
  }catch(e){count.textContent='';grid.innerHTML='<div class="empty">Could not load products. Please refresh.</div>';}
 }
 load();
})();
</script>
</body>
</html>
