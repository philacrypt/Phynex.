<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHYNEX — All Categories</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--brand-blue:#0875e1;--brand-navy:#071a49;--market-green:#0e9f6e;--market-cyan:#0891b2;--ink:#172033;--muted:#687083}
*{box-sizing:border-box}body{margin:0;font-family:'Space Grotesk',Arial,sans-serif;background:#f3f7fb;color:var(--ink);overflow-x:hidden}
.header{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid #dce5ef;padding:15px 5%;position:sticky;top:0;z-index:10}
.top{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{width:260px;height:70px;display:flex;align-items:center;flex:none;overflow:hidden}.brand img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.btn{background:var(--brand-blue);color:#fff;text-decoration:none;padding:10px 15px;border-radius:8px;font-weight:700;box-shadow:0 5px 12px rgba(8,117,225,.2)}
.container{max-width:1200px;margin:auto;padding:0 5% 80px}.category-hero{position:relative;isolation:isolate;overflow:hidden;width:111.111%;min-height:375px;margin-left:-5.555%;margin-bottom:30px;padding:55px 5%;display:flex;align-items:center;background:radial-gradient(ellipse at 76% 58%,rgba(11,139,240,.68),transparent 42%),linear-gradient(112deg,#071a49 4%,#073b87 54%,#0875e1 100%);color:#fff}
.category-hero:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.14),transparent 2px),linear-gradient(135deg,transparent 0 48%,rgba(255,255,255,.05) 48.1% 48.3%,transparent 48.4%);background-size:34px 34px,100% 100%;mask-image:linear-gradient(90deg,#000,transparent 75%)}
.hero-copy{position:relative;z-index:3;width:min(48%,560px)}h1{font-size:clamp(32px,4vw,52px);letter-spacing:0;line-height:1.08;margin:0 0 12px;color:#fff}.hero-copy p{color:rgba(255,255,255,.82);margin:0;max-width:510px;line-height:1.65;font-size:15px}
.hero-scene{position:absolute;inset:0;perspective:1000px;transform-style:preserve-3d;pointer-events:none}
.scene-product{position:absolute;display:grid;place-items:center;width:190px;height:190px;border:1px solid rgba(255,255,255,.72);border-radius:50%;overflow:hidden;background:radial-gradient(circle at 30% 24%,#fff 0,#f5faff 42%,rgba(180,222,255,.88) 100%);box-shadow:inset -12px -16px 28px rgba(7,26,73,.2),0 24px 38px rgba(0,13,47,.36),0 0 30px rgba(105,203,255,.32);transform-style:preserve-3d;animation:product-float 7s ease-in-out infinite}
.scene-product img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.scene-phone{right:37%;top:85px;width:168px;height:168px;transform:rotateY(-18deg) rotateZ(-12deg) translateZ(45px)}
.scene-console{right:19%;top:35px;width:218px;height:218px;animation-delay:-2s;transform:rotateY(15deg) rotateZ(7deg) translateZ(70px)}
.scene-laptop{right:2%;top:145px;width:190px;height:190px;animation-delay:-4s;transform:rotateY(-16deg) rotateZ(8deg) translateZ(15px)}
.scene-audio{right:31%;bottom:-62px;width:154px;height:154px;animation-delay:-1s;transform:rotateY(18deg) rotateZ(-7deg) translateZ(95px)}
.scene-apparel{right:8%;bottom:-70px;width:145px;height:145px;animation-delay:-3s;transform:rotateY(-12deg) rotateZ(9deg) translateZ(35px)}
@keyframes product-float{0%,100%{translate:0 0}50%{translate:0 -12px}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{--glow:var(--brand-blue);position:relative;isolation:isolate;min-height:178px;overflow:hidden;background:linear-gradient(145deg,#fff 8%,#f0f6fc 100%);border:1px solid #dbe6f1;border-radius:16px;padding:20px;text-decoration:none;color:inherit;transition:transform .25s ease,box-shadow .25s ease;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px rgba(7,26,73,.07)}
.card:before{content:'';position:absolute;z-index:-1;width:145px;height:145px;right:-44px;top:-60px;border-radius:48% 52% 64% 36%/42% 40% 60% 58%;background:radial-gradient(circle at 34% 30%,#fff 0 8%,color-mix(in srgb,var(--glow) 78%,white) 27%,var(--glow) 48%,rgba(7,26,73,.06) 76%);filter:blur(.2px);opacity:.62;transform:rotate(-22deg);transition:transform .45s ease,opacity .3s ease}
.card:after{content:'';position:absolute;z-index:-1;width:80px;height:80px;right:27px;top:22px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.62),rgba(8,117,225,.12) 68%);box-shadow:inset -7px -9px 14px rgba(7,26,73,.16),0 8px 20px rgba(7,26,73,.14);opacity:.78}
.card:hover{transform:translateY(-6px) rotateX(2deg);box-shadow:0 18px 34px rgba(7,26,73,.16)}.card:hover:before{transform:rotate(18deg) scale(1.17);opacity:.88}
.icon{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#fff 4%,color-mix(in srgb,var(--glow) 76%,white));color:var(--brand-navy);display:grid;place-items:center;font-size:19px;box-shadow:inset -4px -5px 9px rgba(7,26,73,.16),0 6px 12px rgba(7,26,73,.16);flex:none}
.name{font-weight:800;font-size:16px;display:block;max-width:88%;line-height:1.25;color:var(--brand-navy)}.count{font-size:12px;color:var(--muted);margin-top:6px;display:block}.empty{background:#fff;border-radius:12px;padding:30px;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.scene-phone{right:39%}.scene-console{right:17%}.scene-laptop{right:-3%}}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:11px}.card{padding:15px;min-height:150px}.icon{width:40px;height:40px}.name{font-size:14px}.container{padding:0 14px 60px}.brand{width:230px;height:62px}.category-hero{width:calc(100% + 28px);margin-left:-14px;min-height:430px;margin-bottom:23px;padding:35px 22px;align-items:flex-start}.hero-copy{width:100%;max-width:400px}.hero-copy p{font-size:14px;max-width:350px}.scene-product{width:130px;height:130px}.scene-phone{right:57%;top:auto;bottom:38px;width:120px;height:120px}.scene-console{right:27%;top:auto;bottom:70px;width:152px;height:152px}.scene-laptop{right:-7%;top:auto;bottom:23px;width:128px;height:128px}.scene-audio{right:63%;bottom:-55px;width:105px;height:105px}.scene-apparel{right:8%;bottom:-52px;width:108px;height:108px}}
@media(max-width:380px){.brand{width:190px;height:52px}.top{gap:8px}.btn{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){.card,.card:before,.scene-product{transition:none;animation:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="header"><div class="top"><a class="brand" href="index.html" aria-label="PHYNEX home"><img src="1.jpeg" alt="PHYNEX - Shop Smart. Live Better."></a><a class="btn" href="index.html">Home</a></div></header>
<main class="container">
<section class="category-hero" aria-labelledby="categoryHeading"><div class="hero-scene" aria-hidden="true">
<span class="scene-product scene-phone"><img src="pic 11.jpeg" alt=""></span>
<span class="scene-product scene-console"><img src="8.jpeg" alt=""></span>
<span class="scene-product scene-laptop"><img src="20.jpeg" alt=""></span>
<span class="scene-product scene-audio"><img src="2.jpeg" alt=""></span>
<span class="scene-product scene-apparel"><img src="19.jpeg" alt=""></span>
</div><div class="hero-copy"><h1 id="categoryHeading">Find your next thing.</h1><p>Explore PHYNEX across electronics, fashion, home and more. Real finds, all in their place.</p></div></section>
<div class="grid" id="categories"></div>
</main>
<script>
(async function(){
 const grid=document.getElementById('categories');
 let categorySignature='';
 try{
   await loadCategories();
   window.setInterval(function(){if(document.visibilityState==='visible')loadCategories();},30000);
   document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')loadCategories();});
 }catch(e){grid.innerHTML='<div class="empty">Could not load categories. Please refresh.</div>';console.error(e);}
 async function loadCategories(){
 try{
   const r=await fetch('/api/categories',{cache:'no-store'});
   if(!r.ok) throw new Error('Could not load categories');
   const data=await r.json();
   const categories=Array.isArray(data.categories)?data.categories:[];
   const signature=JSON.stringify(categories.map(c=>[c.id,c.name,c.productCount]));
   if(signature===categorySignature)return;
   categorySignature=signature;
   const colors=['#0875e1','#0e9f6e','#0891b2','#2563eb','#0b8bf0','#14a6a1'];
   grid.innerHTML=categories.length?categories.map((c,i)=>
     '<a class="card" style="--glow:'+colors[i%colors.length]+'" href="category.html?category='+encodeURIComponent(c.name)+'">'+
     '<span class="icon"><i class="fa-solid fa-layer-group"></i></span>'+
     '<span><span class="name">'+escapeHtml(c.name)+'</span><span class="count">'+Number(c.productCount||0)+' items · Explore</span></span></a>'
   ).join(''):'<div class="empty">No categories have been added yet.</div>';
 }catch(e){console.error(e);}
 }
 function escapeHtml(value){const d=document.createElement('div');d.textContent=value||'';return d.innerHTML;}
})();
</script>
</body>
</html>
