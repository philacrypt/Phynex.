<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — PHYNEX</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #172033;
            line-height: 1.6;
        }

        .top {
            background: #071a49;
            color: #fff;
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top a { color: #fff; text-decoration: none; font-size: 14px; }
        .top a:hover { text-decoration: underline; }

        .wrap {
            width: 90%;
            max-width: 420px;
            margin: 50px auto 70px;
        }

        .card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 32px 30px;
        }

        .card h1 { font-size: 24px; margin-bottom: 6px; }

        .card p.sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d9dde5;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus { outline: none; border-color: #0875e1; }

        button.submit {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #0875e1;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button.submit:hover { background: #075fc0; }
        button.submit:disabled { opacity: .6; cursor: default; }

        .switch {
            margin-top: 18px;
            font-size: 13px;
            text-align: center;
            color: #555;
        }

        .switch a { color: #0875e1; font-weight: 700; }

        .msg {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 5px;
            font-size: 13px;
            display: none;
        }

        .msg.error { display: block; background: #fdeaea; color: #b42318; }
        .msg.success { display: block; background: #e8f6ec; color: #0f7a3d; }
    </style>
</head>
<body>

    <header class="top">
        <strong>PHYNEX</strong>
        <a href="index.html">← Continue Shopping</a>
    </header>

    <main class="wrap">
        <div class="card">
            <h1>Reset Password</h1>
            <p class="sub" id="subText">Enter the six-digit code sent to your email and choose a new password.</p>

            <form id="resetForm">

                <label for="email">Account email</label>
                <input type="email" id="email" autocomplete="email" required>

                <label for="code">Six-digit reset code</label>
                <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>

                <label for="password">New password</label>
                <input type="password" id="password" minlength="8" autocomplete="new-password" required>

                <div id="formMsg" class="msg"></div>

                <button type="submit" class="submit" id="submitBtn">Set New Password</button>
            </form>

            <p class="switch"><a href="customer-login.html" id="loginLink">Back to log in</a></p>
        </div>
    </main>

    <script>
        var params = new URLSearchParams(window.location.search);
        var accountType = params.get('type') === 'seller' ? 'seller' : 'customer';
        var accountEmail = params.get('email') || '';
        document.getElementById('email').value = accountEmail;
        if (accountType === 'seller') {
            document.getElementById('loginLink').href = 'seller-login.html';
        }
        document.getElementById('code').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        document.getElementById('resetForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            var msg = document.getElementById('formMsg');
            var btn = document.getElementById('submitBtn');

            msg.className = 'msg';
            msg.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                var response = await fetch('/api/' + (accountType === 'seller' ? 'sellers' : 'customers') + '/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        code: document.getElementById('code').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                var data = await response.json();

                if (!response.ok) {
                    msg.className = 'msg error';
                    msg.textContent = data.message || 'Could not reset your password.';
                    btn.disabled = false;
                    btn.textContent = 'Set New Password';
                    return;
                }

                var account = data[accountType];
                var storagePrefix = accountType === 'seller' ? 'phynexSeller' : 'phynexCustomer';
                localStorage.setItem(storagePrefix + 'Token', data.token);
                localStorage.setItem(storagePrefix + 'Name', account.businessName || account.name);

                msg.className = 'msg success';
                msg.textContent = 'Password updated! Taking you to your account...';

                setTimeout(function () {
                    window.location.href = accountType === 'seller' ? 'seller-dashboard.html' : 'account.html';
                }, 800);

            } catch (error) {
                msg.className = 'msg error';
                msg.textContent = 'Network error. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Set New Password';
            }
        });
    </script>

</body>
</html>
